name: Zig

on:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: zig-ci

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # The install composite uses GitHub's $/ self-reference, so bootstrap
      # with its standalone action on Forgejo.
      - name: Set up ghr
        uses: https://github.com/cataggar/ghr/actions/setup@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        with:
          ghr-version: v0.9.1
          cache: 'false'

      - name: Install Zig via ghr
        run: |
          set -eu
          install_root="${RUNNER_TEMP:?}/zlua-ghr-install"
          rm -rf -- "$install_root"
          export GHR_TOOL_DIR="$install_root/tools"
          export GHR_BIN_DIR="$install_root/bin"
          export GHR_CACHE_DIR="$install_root/cache"
          mkdir -p "$GHR_TOOL_DIR" "$GHR_BIN_DIR" "$GHR_CACHE_DIR"
          ghr install --no-auth \
            cataggar/zig@v0.16.0 \
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
          echo "$GHR_BIN_DIR" >> "$GITHUB_PATH"

      - name: Show Zig version
        run: zig version

      - name: Cache Lua dependencies
        uses: https://code.forgejo.org/actions/cache@v5
        with:
          path: .zlua-deps
          key: ${{ runner.os }}-lua-5.5.0-${{ hashFiles('tools/fetch-lua.sh') }}

      - name: Build and test
        run: zig build ci
